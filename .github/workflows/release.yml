name: Release Plugin

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '>=3.9'
          cache: 'pip'
      
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      
      - name: Install git-cliff
        run: cargo install git-cliff
      
      - name: Install dependencies
        run: |
          pip install class-widgets-sdk
          pip install -e .

      - name: Remove files not meant for packaging (before build)
        run: |
          # 运行时生成的配置/日志/缓存等不应打进插件包
          rm -rf previews/
          rm -f settings.json
          rm -rf log/
          rm -rf __pycache__/
          rm -rf cw2_lessons_displayer.egg-info/
          # 仓库/CI 专用文件也不应打进包
          rm -rf .github/
          rm -f .gitignore .git-cliff.toml
          echo "Removed non-packaging files"
      
      - name: Build .cwplugin package
        run: cw-plugin-pack
      
      - name: Build .zip package
        run: cw-plugin-pack --format zip
      
      - name: List generated files
        run: ls -la *.cwplugin *.zip || echo "No files found"
      
      - name: Verify package contents (both formats contain qml/)
        run: |
          unzip -l *.cwplugin | grep qml/ && echo "✅ .cwplugin includes qml/" || echo "❌ .cwplugin missing qml/"
          unzip -l *.zip | grep qml/ && echo "✅ .zip includes qml/" || echo "❌ .zip missing qml/"
      
      - name: Publish to plugin registry
        env:
          CWPT_TOKEN: ${{ secrets.CWPT_TOKEN }}
        run: |
          cw-plugin-publish
      
      - name: Get version from tag
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_ENV
      
      - name: Generate changelog with git-cliff
        run: |
          git-cliff --config .git-cliff.toml --latest --output CHANGELOG.md
          echo "CHANGELOG<<EOF" >> $GITHUB_ENV
          cat CHANGELOG.md >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV
      
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release v${{ env.VERSION }}
          draft: false
          prerelease: false
          files: |
            *.cwplugin
            *.zip
          body: ${{ env.CHANGELOG }}
          generate_release_notes: false